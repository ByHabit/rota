<script>
function htmlKacis(metin) {
    return String(metin === undefined || metin === null ? "" : metin)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function telSadelestir(numara) { return String(numara || "").replace(/[^0-9+]/g, ""); }

function koordinatCoz(metin) {
    var m = String(metin || "").trim();
    if (!m) { return null; }
    var kalip = [/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,
                 /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/,
                 /destination=(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,
                 /(-?\d{1,3}\.\d+)[,;\s]+(-?\d{1,3}\.\d+)/];
    for (var i = 0; i < kalip.length; i++) {
        var e = m.match(kalip[i]);
        if (!e) { continue; }
        var enlem = parseFloat(e[1]), boylam = parseFloat(e[2]);
        if (enlem >= -90 && enlem <= 90 && boylam >= -180 && boylam <= 180) {
            return { enlem: enlem, boylam: boylam };
        }
    }
    return null;
}

function ogrenciBul(kimlik) {
    for (var i = 0; i < ogrenciler.length; i++) {
        if (ogrenciler[i].id === kimlik) { return ogrenciler[i]; }
    }
    return null;
}

function yeniKimlik() {
    return "o" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
}

function kartUret(o, numara) {
    var etiketler = "";
    if (o.mesafe) { etiketler += '                <span class="rozet-mesafe">' + htmlKacis(o.mesafe) + '</span>\n'; }
    if (o.enlem !== undefined && o.enlem !== null && o.enlem !== "") {
        etiketler += '                <span class="uzaklik" data-lat="' + o.enlem + '" data-lng="' + o.boylam + '"></span>\n';
    }

    var telSatir = "";
    if (o.telefon) {
        telSatir = '                <a class="tel" href="tel:' + htmlKacis(telSadelestir(o.telefon)) + '">&#128222; ' + htmlKacis(o.telefon) + '</a>\n';
    }

    var basNo = numara ? '<span class="sira-no">' + numara + '</span>' : "";
    var latVal = (o.enlem !== undefined && o.enlem !== null) ? o.enlem : "";
    var lngVal = (o.boylam !== undefined && o.boylam !== null) ? o.boylam : "";
    var telVal = telSadelestir(o.telefon || "");

    return '        <li class="kart" id="kart-' + htmlKacis(o.id) + '" data-id="' + htmlKacis(o.id) + '">\n' +
'            <div class="kart-ust">\n' +
'                <button class="tik-btn" onclick="durumDegistir(\'' + jsKacis(o.id) + '\')" title="Alındı">&#10003;</button>\n' +
'                <div class="kisi">\n' +
'                    <h2>' + basNo + htmlKacis(o.ad) + '</h2>\n' +
'                    <p>' + htmlKacis(o.mahalle) + '</p>\n' +
'                    <div>' + etiketler + telSatir + '</div>\n' +
'                </div>\n' +
'            </div>\n' +
'            <div class="butonlar">\n' +
'                <button class="nav-btn gmaps" onclick="navigasyonAc(\'' + latVal + '\', \'' + lngVal + '\', \'' + jsKacis(o.link) + '\')">Yol Tarifi</button>\n' +
'                <button class="gonder" onclick="waSecimAc(\'' + jsKacis(o.ad) + '\', \'' + jsKacis(o.mahalle) + '\', \'' + jsKacis(o.link) + '\', \'' + telVal + '\')">WhatsApp</button>\n' +
'            </div>\n' +
'        </li>\n';
}

    return '<!DOCTYPE html>\n' +

'\n' +

'/* ---------- Mesafe Hesapları ---------- */\n' +
'function kusUcusu(e1, b1, e2, b2) {\n' +
'    var R = 6371000;\n' +
'    var f1 = e1 * Math.PI / 180, f2 = e2 * Math.PI / 180;\n' +
'    var df = (e2 - e1) * Math.PI / 180, dl = (b2 - b1) * Math.PI / 180;\n' +

'\n' +
'    var sabitler = kutu.getElementsByClassName("sekme");\n' +
'    for (var s = 0; s < sabitler.length; s++) {\n' +
'        var ah = sabitler[s].getAttribute("data-anahtar");\n' +
'        if (!ah) continue;\n' +
'        var temel = (ah.indexOf("yerel-") === 0) ? "sekme yerel uretilen" : "sekme";\n' +
'        sabitler[s].className = temel + (ah === aktifAnahtar ? " aktif" : "");\n' +
'    }\n' +
'}\n' +
'function sekmeSec(hedef) { aktifAnahtar = hedef; aktifYerel = -1; sekmeleriCiz(); filtrele(); window.scrollTo(0,0); }\n' +
'function yerelSec(sira) { aktifYerel = sira; aktifAnahtar = "yerel-" + sira; sekmeleriCiz(); yerelCiz(); filtrele(); window.scrollTo(0,0); }\n' +
'function yerelOlustur() {\n' +
'    var t = new Date(); var oneri = ("0" + t.getDate()).slice(-2) + "." + ("0" + (t.getMonth() + 1)).slice(-2) + " Sabah";\n' +
'    var ad = prompt("Liste adı:", oneri);\n' +
'    if (!ad) return;\n' +
'    yerelListeler.push({ ad: ad.trim(), uyeler: [] });\n' +
'    yerelKaydet(); yerelSec(yerelListeler.length - 1);\n' +
'}\n' +
'function yerelAdDegistir() {\n' +
'    if (aktifYerel < 0) return;\n' +
'    var ad = prompt("Yeni ad:", yerelListeler[aktifYerel].ad);\n' +
'    if (!ad) return;\n' +
'    yerelListeler[aktifYerel].ad = ad.trim();\n' +
'    yerelKaydet(); sekmeleriCiz(); yerelCiz();\n' +
'}\n' +
'function yerelSil() {\n' +
'    if (aktifYerel < 0 || !confirm("Bu liste silinsin mi?")) return;\n' +
'    yerelListeler.splice(aktifYerel, 1);\n' +
'    yerelKaydet(); sekmeSec("bolum-hepsi");\n' +
'}\n' +
'function yerelEkle(kimlik) { if (aktifYerel < 0) return; yerelListeler[aktifYerel].uyeler.push(kimlik); yerelKaydet(); sekmeleriCiz(); yerelCiz(); filtrele(); }\n' +
'function yerelCikar(sira) { if (aktifYerel < 0) return; yerelListeler[aktifYerel].uyeler.splice(sira, 1); yerelKaydet(); sekmeleriCiz(); yerelCiz(); filtrele(); }\n' +
'function yerelBosalt() { if (aktifYerel < 0 || !confirm("Tüm duraklar çıkarılsın mı?")) return; yerelListeler[aktifYerel].uyeler = []; yerelKaydet(); sekmeleriCiz(); yerelCiz(); filtrele(); }\n' +
'function yerelPaylas() {\n' +
'    if (aktifYerel < 0) return;\n' +
'    var L = yerelListeler[aktifYerel]; var metin = L.ad + "\\n\\n"; var n = 0;\n' +
'    for (var i = 0; i < L.uyeler.length; i++) {\n' +
'        var o = ogrBul(L.uyeler[i]); if (!o) continue;\n' +
'        n++; metin += n + ". " + o.ad + " - " + o.mahalle + "\\n" + o.link + "\\n\\n";\n' +
'    }\n' +
'    if (n === 0) { alert("Liste boş."); return; }\n' +
'    if (navigator.share) { navigator.share({ title: L.ad, text: metin }).catch(function(){}); }\n' +
'    else { window.open("https://wa.me/?text=" + encodeURIComponent(metin), "_blank"); }\n' +
'}\n' +
'function siralaAcKapa() { var k = document.getElementById("siralaKutu"); if(k) k.style.display = (k.style.display === "block") ? "none" : "block"; }\n' +
'function yerelSirala(tur) {\n' +
'    if (aktifYerel < 0) return;\n' +
'    var L = yerelListeler[aktifYerel];\n' +
'    if (tur === "ters") { L.uyeler.reverse(); yerelKaydet(); yerelCiz(); filtrele(); return; }\n' +
'    var dizi = [];\n' +
'    for (var i = 0; i < L.uyeler.length; i++) {\n' +
'        var o = ogrBul(L.uyeler[i]); var val = null;\n' +
'        if (o) {\n' +
'            if (tur === "yakin" && benimKonum && o.enlem) val = kusUcusu(benimKonum.e, benimKonum.b, o.enlem, o.boylam);\n' +
'            else if (tur === "isim") val = sadelestir(o.ad || "");\n' +
'        }\n' +
'        dizi.push({ id: L.uyeler[i], val: val, sira: i });\n' +
'    }\n' +
'    dizi.sort(function(a, b) {\n' +
'        if (a.val === null) return 1; if (b.val === null) return -1;\n' +
'        return (a.val > b.val ? 1 : a.val < b.val ? -1 : 0) || (a.sira - b.sira);\n' +
'    });\n' +
'    L.uyeler = dizi.map(function(item){ return item.id; });\n' +
'    yerelKaydet(); yerelCiz(); filtrele();\n' +
'}\n' +
'\n' +
'function yerelCiz() {\n' +
'    var bolum = document.getElementById("bolum-yerel");\n' +
'    if (aktifYerel < 0 || !yerelListeler[aktifYerel]) { bolum.innerHTML = ""; return; }\n' +
'    var L = yerelListeler[aktifYerel];\n' +
'    var h = \x27<div class="bolum-baslik-satir"><div class="bolum-basligi">\x27 + kacis(L.ad) + " &middot; " + L.uyeler.length + " durak</div>" +\n' +
'            \x27<button class="rota-harita-btn" onclick="rotaMenuAc(\\\'bolum-yerel\\\')">&#128506; Rotayı Aç</button></div>\x27;\n' +
'    h += \x27<div class="yerel-arac">\x27 +\n' +
'         \x27<button class="arac-btn vurgu" onclick="yerelPaylas()">Paylaş</button>\x27 +\n' +
'         (L.uyeler.length > 1 ? \x27<button class="arac-btn" onclick="siralaAcKapa()">Sırala</button>\x27 : "") +\n' +
'         \x27<button class="arac-btn" onclick="yerelAdDegistir()">Ad Değiştir</button>\x27 +\n' +
'         \x27<button class="arac-btn tehlike" onclick="yerelBosalt()">Boşalt</button>\x27 +\n' +
'         \x27<button class="arac-btn tehlike" onclick="yerelSil()">Sil</button>\x27 +\n' +
'         "</div>";\n' +
'    if (L.uyeler.length > 1) {\n' +
'        h += \x27<div class="sirala-kutu" id="siralaKutu">\x27 +\n' +
'             \x27<button class="sirala-sec" onclick="yerelSirala(\\\'yakin\\\')">Bana Yakından Uzağa</button>\x27 +\n' +
'             \x27<button class="sirala-sec" onclick="yerelSirala(\\\'isim\\\')">İsme Göre (A-Z)</button>\x27 +\n' +
'             \x27<button class="sirala-sec" onclick="yerelSirala(\\\'ters\\\')">Sırayı Ters Çevir</button>\x27 +\n' +
'             "</div>";\n' +
'    }\n' +
'    if (L.uyeler.length === 0) {\n' +
'        h += \x27<div class="bos-not">Liste boş. Aşağıdan öğrenci ekleyin.</div>\x27;\n' +
'    } else {\n' +
'        h += \x27<ul class="liste">\x27;\n' +
'        for (var i = 0; i < L.uyeler.length; i++) {\n' +
'            var o = ogrBul(L.uyeler[i]); if (!o) continue;\n' +
'            var latV = (o.enlem !== undefined && o.enlem !== null) ? o.enlem : "";\n' +
'            var lngV = (o.boylam !== undefined && o.boylam !== null) ? o.boylam : "";\n' +
'            var telV = telSade(o.telefon || "");\n' +
'            h += \x27<li class="kart sirali" id="kart-\x27 + kacis(o.id) + \x27" data-id="\x27 + kacis(o.id) + \x27" draggable="true" ondragstart="surukleBasla(event, \x27 + i + \x27)" ondragend="surukleBitir(event)" ondragover="surukleUzerinde(event)" ondrop="surukleBirak(event, \x27 + i + \x27)">\x27 +\n' +
'                 \x27<div class="tut-sutun">\x27 +\n' +
'                     \x27<button class="ok" onclick="yerelTasi(\x27 + i + \x27,-1)"\x27 + (i === 0 ? " disabled" : "") + ">&#9650;</button>" +\n' +
'                     \x27<div class="surukle-tut">&#9776;</div>\x27 +\n' +
'                     \x27<button class="ok" onclick="yerelTasi(\x27 + i + \x27,1)"\x27 + (i === L.uyeler.length - 1 ? " disabled" : "") + ">&#9660;</button>" +\n' +
'                 \x27</div>\x27 +\n' +
'                 \x27<div class="kart-govde">\x27 +\n' +
'                     \x27<div class="kart-ust">\x27 +\n' +
'                         \x27<button class="tik-btn" onclick="durumDegistir(\\\x27\x27 + jsKacis(o.id) + \x27\\\x27)">&#10003;</button>\x27 +\n' +
'                         \x27<div class="kisi">\x27 +\n' +
'                             \x27<h2><span class="sira-no">\x27 + (i + 1) + "</span>" + kacis(o.ad) + "</h2>" +\n' +
'                             "<p>" + kacis(o.mahalle) + "</p>" +\n' +
'                             (o.mesafe ? \x27<span class="rozet-mesafe">\x27 + kacis(o.mesafe) + "</span>" : "") +\n' +
'                             (o.enlem ? \x27<span class="uzaklik" data-lat="\x27 + o.enlem + \x27" data-lng="\x27 + o.boylam + \x27"></span>\x27 : "") +\n' +
'                             (o.telefon ? \x27<a class="tel" href="tel:\x27 + kacis(telSade(o.telefon)) + \x27">&#128222; \x27 + kacis(o.telefon) + "</a>" : "") +\n' +
'                         "</div>" +\n' +
'                     "</div>" +\n' +
'                     \x27<div class="butonlar">\x27 +\n' +
'                         \x27<button class="nav-btn gmaps" onclick="navigasyonAc(\\\x27\x27 + latV + \x27\\\x27, \\\x27\x27 + lngV + \x27\\\x27, \\\x27\x27 + jsKacis(o.link) + \x27\\\x27)">Yol Tarifi</button>\x27 +\n' +
'                         \x27<button class="gonder" onclick="waSecimAc(\\\x27\x27 + jsKacis(o.ad) + \x27\\\x27, \\\x27\x27 + jsKacis(o.mahalle) + \x27\\\x27, \\\x27\x27 + jsKacis(o.link) + \x27\\\x27, \\\x27\x27 + telV + \x27\\\x27)">WhatsApp</button>\x27 +\n' +
'                         \x27<button class="cikar" onclick="yerelCikar(\x27 + i + \x27)">Çıkar</button>\x27 +\n' +
'                     "</div>" +\n' +
'                 "</div></li>";\n' +
'        }\n' +
'        h += "</ul>";\n' +
'    }\n' +
'    h += \x27<div class="bolum-basligi" style="margin-top:24px;">Listeye Öğrenci Ekle</div>\x27;\n' +
'    var eklenecek = 0; var e = "";\n' +
'    for (var k = 0; k < OGRENCILER.length; k++) {\n' +
'        var ogr = OGRENCILER[k]; var varMi = false;\n' +
'        for (var z = 0; z < L.uyeler.length; z++) { if (L.uyeler[z] === ogr.id) { varMi = true; break; } }\n' +
'        if (varMi) continue;\n' +
'        eklenecek++;\n' +
'        e += \x27<div class="ekle-satir"><div class="ekle-bilgi"><div class="ekle-ad">\x27 + kacis(ogr.ad) + "</div>" +\n' +
'             \x27<div class="ekle-alt">\x27 + kacis(ogr.mahalle) + (ogr.mesafe ? " &middot; " + kacis(ogr.mesafe) : "") + "</div></div>" +\n' +
'             \x27<button class="ekle-btn" onclick="yerelEkle(\\\x27\x27 + ogr.id + \x27\\\x27)">Ekle</button></div>\x27;\n' +
'    }\n' +
'    h += (eklenecek === 0) ? \x27<div class="bos-not">Tüm öğrenciler listede.</div>\x27 : e;\n' +
'    bolum.innerHTML = h;\n' +
'    uzakliklariYaz(); tikleriYukle();\n' +
'}\n' +
'\n' +
'/* ---------- Arama ve Görünürlük ---------- */\n' +
'function filtrele() {\n' +
'    var kutu = document.getElementById("arama"); if (!kutu) return;\n' +
'    var aranan = sadelestir(kutu.value).replace(/^\\s+|\\s+$/g, "");\n' +
'    var aramaVar = (aranan !== "");\n' +
'    var bolumler = document.getElementsByClassName("bolum");\n' +
'    var yerelAcik = (aktifYerel >= 0);\n' +
'    var toplam = 0;\n' +
'    for (var b = 0; b < bolumler.length; b++) {\n' +
'        var yerelMi = (bolumler[b].id === "bolum-yerel");\n' +
'        var kartlar = bolumler[b].getElementsByClassName("kart");\n' +
'        var gorunen = 0;\n' +
'        for (var i = 0; i < kartlar.length; i++) {\n' +
'            var metin = sadelestir(kartlar[i].textContent || "");\n' +
'            if (!aramaVar || metin.indexOf(aranan) !== -1) {\n' +
'                kartlar[i].style.display = (kartlar[i].className.indexOf("sirali") !== -1) ? "flex" : "block"; gorunen++;\n' +
'            } else { kartlar[i].style.display = "none"; }\n' +
'        }\n' +
'        var satirlar = bolumler[b].getElementsByClassName("ekle-satir");\n' +
'        var satirGorunen = 0;\n' +
'        for (var s2 = 0; s2 < satirlar.length; s2++) {\n' +
'            var m2 = sadelestir(satirlar[s2].textContent || "");\n' +
'            if (!aramaVar || m2.indexOf(aranan) !== -1) {\n' +
'                satirlar[s2].style.display = "flex"; satirGorunen++;\n' +
'            } else { satirlar[s2].style.display = "none"; }\n' +
'        }\n' +
'        if (yerelMi) { gorunen += satirGorunen; }\n' +
'        var gorunsun = yerelMi ? yerelAcik : (yerelAcik ? false : (aramaVar ? (gorunen > 0) : (bolumler[b].id === aktifAnahtar)));\n' +
'        bolumler[b].style.display = gorunsun ? "block" : "none";\n' +
'        if (gorunsun) toplam += gorunen;\n' +
'    }\n' +
'    document.getElementById("bosNot").style.display = (toplam === 0 && aramaVar) ? "block" : "none";\n' +
'    var tb = document.getElementById("temizleBtn"); if (tb) tb.style.display = (kutu.value.length > 0) ? "block" : "none";\n' +
'    var ss = document.getElementById("sonucSatiri"); if (ss) { ss.style.display = aramaVar ? "block" : "none"; ss.textContent = toplam + " kayıt bulundu"; }\n' +
'}\n' +
'function aramaTemizle() {\n' +
'    var k = document.getElementById("arama"); if (!k) return; k.value = "";\n' +
'    aktifMahalleFiltre = "";\n' +
'    document.querySelectorAll(".mahalle-cip").forEach(function(c){ c.classList.remove("aktif"); });\n' +
'    filtrele(); k.focus();\n' +
'}\n' +
'var aramaKutu = document.getElementById("arama");\n' +
'if (aramaKutu) {\n' +
'    aramaKutu.oninput = filtrele;\n' +
'    aramaKutu.onkeydown = function(e){ if(e.keyCode===27) aramaTemizle(); if(e.keyCode===13) aramaKutu.blur(); };\n' +
'}\n' +
'yerelYukle(); sekmeleriCiz(); mahalleFiltreleriniKur(); filtrele(); tikleriYukle();\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';
}

function b64Yaz(metin) { return btoa(unescape(encodeURIComponent(metin))); }

function b64Oku(veri) { return decodeURIComponent(escape(atob(String(veri).replace(/\s/g, "")))); }


var ogrenciler = [];
var guzergahlar = [];

/* Adresin sonuna taze bir zaman damgasi koyup yeniden yukler. */
function sayfayiYenile() {
    var temiz = location.href.split("#")[0].split("?")[0];
    location.replace(temiz + "?v=" + Date.now());
}

function el(k) { return document.getElementById(k); }
function bildir(mesaj, tur) { var d = el("durum"); d.className = "durum " + (tur || "bilgi"); d.innerHTML = htmlKacis(mesaj); window.scrollTo(0, 0); }
function ayarKaydet() {
    try {
        localStorage.setItem("rota_kullanici", el("kullanici").value.trim());
        localStorage.setItem("rota_depo", el("depo").value.trim());
        localStorage.setItem("rota_token", el("token").value.trim());
    } catch (e) {}
}
function ayarOku() {
    try {
        el("kullanici").value = localStorage.getItem("rota_kullanici") || "";
        el("depo").value = localStorage.getItem("rota_depo") || "";
        el("token").value = localStorage.getItem("rota_token") || "";
    } catch (e) {}
}
function ayarlariAc() { el("ayarBlok").style.display = "block"; el("ayarAc").style.display = "none"; }
function apiAdresi(dosya) { return "https://api.github.com/repos/" + el("kullanici").value.trim() + "/" + el("depo").value.trim() + "/contents/" + dosya; }
function baslik() { return { "Authorization": "Bearer " + el("token").value.trim(), "Accept": "application/vnd.github+json", "Content-Type": "application/json" }; }

function shaAl(dosya) {
    return fetch(apiAdresi(dosya) + "?t=" + Date.now(), { headers: baslik() })
        .then(function(c){ return c.status === 404 ? null : c.json(); })
        .then(function(v){ return (v && v.sha) ? v.sha : null; })
        .catch(function(){ return null; });
}
function dosyaYaz(dosya, icerik, mesaj) {
    return shaAl(dosya).then(function(guncelSha){
        var govde = { message: mesaj, content: b64Yaz(icerik) };
        if (guncelSha) govde.sha = guncelSha;
        return fetch(apiAdresi(dosya), { method: "PUT", headers: baslik(), body: JSON.stringify(govde) })
            .then(function(c){ return c.json().then(function(v){ if(!c.ok) throw new Error(dosya + " yazılamadı"); return v.content.sha; }); });
    });
}
function baglan() {
    if (!el("kullanici").value.trim() || !el("depo").value.trim() || !el("token").value.trim()) {
        bildir("Üç alanın da dolu olması gerekiyor.", "hata"); return;
    }
    ayarKaydet(); bildir("Bağlanılıyor...", "bilgi");
    fetch(apiAdresi("veriler.json") + "?t=" + Date.now(), { headers: baslik() })
        .then(function(c){
            if (c.status === 401) throw new Error("Erişim anahtarı geçersiz.");
            if (!c.ok) throw new Error("GitHub yanıtı: " + c.status);
            return c.json();
        })
        .then(function(v){
            var icerik = JSON.parse(b64Oku(v.content));
            ogrenciler = icerik.ogrenciler || icerik || [];
            guzergahlar = icerik.guzergahlar || [];
            el("ayarBlok").style.display = "none"; el("ayarAc").style.display = "block"; el("formBlok").style.display = "block";
            el("sayi").innerHTML = "Listede " + ogrenciler.length + " öğrenci var.";
            bildir("Bağlandı. Öğrenci bilgilerini girebilirsin.", "ok");
        })
        .catch(function(h){ bildir(h.message, "hata"); });
}
function konumuKullan() {
    if (!navigator.geolocation) { bildir("Konum desteklenmiyor.", "hata"); return; }
    el("konumBtn").innerHTML = "Alınıyor...";
    navigator.geolocation.getCurrentPosition(function(p){
        var e = p.coords.latitude.toFixed(6); var b = p.coords.longitude.toFixed(6);
        el("koordinat").value = e + ", " + b;
        el("konumBtn").innerHTML = "Konumu Yeniden Al";
        if (!el("link").value.trim()) el("link").value = "https://www.google.com/maps/dir/?api=1&destination=" + e + "," + b;
        bildir("Konum alındı.", "ok");
    }, function(){ el("konumBtn").innerHTML = "Şu Anki Konumumu Kullan"; bildir("Konum alınamadı.", "hata"); }, { enableHighAccuracy: true });
}
function kaydet() {
    var ad = el("ad").value.trim(); var mahalle = el("mahalle").value.trim();
    var mesafe = el("mesafe").value.trim(); var telefon = el("telefon").value.trim();
    var link = el("link").value.trim(); var koordMetin = el("koordinat").value.trim();
    if (!ad) { bildir("Ad soyad boş bırakılamaz.", "hata"); el("ad").focus(); return; }
    if (!mahalle) { bildir("Mahalle boş bırakılamaz.", "hata"); el("mahalle").focus(); return; }
    if (link.indexOf("http") !== 0) { bildir("Konum linki http ile başlamalı.", "hata"); el("link").focus(); return; }
    var koord = null;
    if (koordMetin) {
        koord = koordinatCoz(koordMetin);
        if (!koord) { bildir("Koordinat okunamadı. Örnek: 40.815432, 29.301887", "hata"); el("koordinat").focus(); return; }
    }
    var kayit = { id: yeniKimlik(), ad: ad, mahalle: mahalle, mesafe: mesafe, telefon: telefon, link: link };
    if (koord) { kayit.enlem = koord.enlem; kayit.boylam = koord.boylam; }
    ogrenciler.push(kayit);
    el("kaydetBtn").disabled = true; el("kaydetBtn").innerHTML = "Kaydediliyor...";
    var damga = new Date().toLocaleString("tr-TR");
    var jsonMetin = JSON.stringify({ surum: 2, ogrenciler: ogrenciler, guzergahlar: guzergahlar }, null, 4);
    dosyaYaz("veriler.json", jsonMetin, ad + " eklendi (" + damga + ")")
        .then(function(){
            return dosyaYaz("index.html", listeSayfasiUret(), "Liste güncellendi (" + damga + ")");
        })
        .then(function(){
            el("ad").value = ""; el("mahalle").value = ""; el("mesafe").value = ""; el("telefon").value = ""; el("link").value = ""; el("koordinat").value = "";
            el("kaydetBtn").disabled = false; el("kaydetBtn").innerHTML = "Kaydet ve Yayınla";
            el("sayi").innerHTML = "Listede " + ogrenciler.length + " öğrenci var.";
            bildir(ad + " kaydedildi ve yayınlandı.", "ok");
        })
        .catch(function(h){
            ogrenciler.pop(); el("kaydetBtn").disabled = false; el("kaydetBtn").innerHTML = "Kaydet ve Yayınla";
            bildir((h && h.message ? h.message : "Bilinmeyen hata") + " Kayıt eklenmedi, tekrar dene.", "hata");
        });
}
el("link").oninput = function(){
    if (el("koordinat").value.trim()) return;
    var k = koordinatCoz(el("link").value);
    if (k) el("koordinat").value = k.enlem.toFixed(6) + ", " + k.boylam.toFixed(6);
};
ayarOku();
if (el("kullanici").value && el("depo").value && el("token").value) { baglan(); }
</script>
</body>
</html>
